<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inhaler Reminder</title>
  <link rel="stylesheet" href="notification.css">
</head>
<body>
  <div id="card" class="card" role="alert" aria-live="polite">
    <div class="graphic" aria-hidden="true">
      <svg class="inhaler" viewBox="0 0 96 150" width="78" height="122" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#18c9b5"/>
            <stop offset="1" stop-color="#0c6b86"/>
          </linearGradient>
          <linearGradient id="canGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#eef3f7"/>
            <stop offset="0.5" stop-color="#c4cedb"/>
            <stop offset="1" stop-color="#93a1b3"/>
          </linearGradient>
          <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a4654"/>
            <stop offset="1" stop-color="#232c37"/>
          </linearGradient>
        </defs>

        <rect x="37" y="6" width="26" height="12" rx="4" fill="url(#capGrad)"/>
        <rect x="41" y="17" width="18" height="48" rx="5" fill="url(#canGrad)"/>
        <rect x="44" y="21" width="3" height="42" rx="1.5" fill="#ffffff" opacity="0.5"/>
        <rect x="40" y="52" width="20" height="6" rx="3" fill="#7f8d9f"/>

        <rect x="32" y="58" width="36" height="62" rx="9" fill="url(#bootGrad)"/>
        <rect x="57" y="84" width="24" height="20" rx="7" fill="url(#bootGrad)"/>
        <rect x="78" y="88" width="4" height="12" rx="2" fill="#063a46"/>

        <rect x="40" y="104" width="12" height="8" rx="2" fill="#0a3a45" opacity="0.55"/>
        <rect x="42" y="106" width="8" height="4" rx="1.5" fill="#11505e" opacity="0.8"/>

        <g class="puff">
          <circle cx="84" cy="92" r="2.6" fill="#7ff0e2"/>
          <circle cx="89" cy="96" r="2" fill="#5adfce"/>
          <circle cx="86" cy="86" r="1.8" fill="#b3f8ee"/>
        </g>
      </svg>
    </div>

    <div class="content">
      <h1 id="notif-title" class="title"></h1>
      <span id="notif-chip" class="chip"></span>
      <p id="notif-body" class="body"></p>
      <div class="actions">
        <button id="confirm" type="button" class="btn btn-primary"></button>
        <button id="snooze" type="button" class="btn btn-ghost"></button>
      </div>
    </div>
  </div>

  <script src="notification.js"></script>
</body>
</html>
