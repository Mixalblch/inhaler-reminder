<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inhaler Reminder</title>
  <link rel="stylesheet" href="notification.css" />
</head>
<body>
  <!--
    THESIS: Breath Console makes a twice-daily health routine feel like a calm, dependable instrument and refuses the category's teal glass card stack.
    OWN-WORLD: warm paper workspace, charcoal equipment rail, clay actions, sage confirmation, thin rules, and one authored inhaler illustration.
    STORY: identify the dose, read the reminder, then confirm inhalation or defer it without navigating away from the current task.
    FIRST VIEWPORT: the inhaler occupies a dark object bay on the left; dose and instruction lead the paper field; confirm and snooze close the message.
    FORM: compact equipment ledger, user-pinned direction, seed 26ff0634.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div id="card" class="notification-card" role="alert" aria-live="polite">
    <div class="notification-art" aria-hidden="true">
      <svg class="brand-mark" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="3" fill="currentColor" />
        <path d="M14 2v7M14 19v7M2 14h7M19 14h7M5.5 5.5l5 5M17.5 17.5l5 5M22.5 5.5l-5 5M10.5 17.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <img src="../../../assets/inhaler-illustration.png" alt="" />
    </div>

    <div class="notification-content">
      <span id="notif-chip" class="chip"></span>
      <h1 id="notif-title" class="title"></h1>
      <p id="notif-body" class="body"></p>
      <div class="actions">
        <button id="confirm" type="button" class="btn btn-primary"></button>
        <button id="snooze" type="button" class="btn btn-secondary"></button>
      </div>
    </div>
  </div>

  <script src="notification.js"></script>
</body>
</html>
