<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inhaler Reminder</title>
  <link rel="stylesheet" href="notification.css" />
</head>
<body>
  <div class="card" id="card" role="alert" aria-live="polite">
    <svg class="breath-mark" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="58" cy="100" r="11" fill="currentColor" />
      <path d="M84 62a46 46 0 0 1 0 76" stroke="currentColor" stroke-width="9" fill="none" stroke-linecap="round" />
      <path d="M108 44a68 68 0 0 1 0 112" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7" />
      <path d="M132 26a90 90 0 0 1 0 148" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round" opacity=".45" />
    </svg>

    <div class="copy">
      <div class="dose-meta" id="doseMeta">
        <span class="dose-dot" aria-hidden="true"></span>
        <span class="chip" id="doseChip"></span>
        <span class="badge" id="doseBadge"></span>
      </div>

      <h1 id="notifTitle"></h1>
      <p id="notifBody"></p>
      <p class="next" id="nextLine"></p>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="confirmBtn"></button>
      <button type="button" class="btn secondary" id="snoozeBtn"></button>
      <button type="button" class="btn primary" id="okBtn" hidden></button>
    </div>
  </div>

  <script src="notification.js"></script>
</body>
</html>
