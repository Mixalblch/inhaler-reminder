<!-- App icon, Claude Design direction 2a, variant A "Тиловая".
     Proportions follow the previous icon (cap bar, tall body, short narrow
     mouthpiece with clear space, two exhale dots); the coral mouthpiece comes
     from the in-app inhaler illustration. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17b7a4"/>
      <stop offset="1" stop-color="#0d8578"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="120" height="120" rx="27" fill="url(#tile)"/>
  <g transform="translate(-1.2 12) scale(1.02)">
    <g transform="rotate(-6 58 42)">
      <rect x="34" y="5" width="30" height="12" rx="4" fill="#c9ced1"/>
      <rect x="30" y="21" width="38" height="47" rx="10" fill="#f8f4ec"/>
      <rect x="69" y="46" width="17" height="18" rx="5" fill="#ee7a56"/>
      <rect x="37" y="30" width="24" height="28" rx="7" fill="none" stroke="#b3ac9e" stroke-width="2.6" opacity=".4"/>
    </g>
    <circle cx="92" cy="49" r="3.8" fill="#ffffff"/>
    <circle cx="98" cy="58" r="2.4" fill="#ffffff" opacity=".7"/>
  </g>
</svg>
